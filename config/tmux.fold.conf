# OSIRIS Mobile — fold-aware tmux configuration.
# Loaded by launch_fold.sh into the `osiris` session only; your global ~/.tmux.conf
# is untouched.

set -g mouse on                      # touch: tap to select a pane, drag to resize
set -g history-limit 5000            # bounded: a phone is not a workstation
set -g base-index 0
set -g pane-base-index 0
set -g escape-time 10                # soft keyboards send escapes slowly
set -g focus-events on
setw -g aggressive-resize on         # required for live fold/unfold resizing

# Status line: narrow enough for the cover display, informative when unfolded.
set -g status on
set -g status-interval 30
set -g status-style "bg=colour234,fg=colour250"
set -g status-left "#[bold]OSIRIS#[default] "
set -g status-left-length 12
set -g status-right "#{?#{>=:#{client_width},100},#[fg=colour114]unfolded,#[fg=colour179]narrow}#[default] #{client_width}x#{client_height} %H:%M"
set -g status-right-length 40
setw -g window-status-current-style "fg=colour45,bold"

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour45"
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_title} "

# Fold-aware keybinds.
bind R run-shell -b "#{@osiris_launcher} --relayout --session #{session_name}"
bind T run-shell -b "#{@osiris_launcher} --toggle --session #{session_name}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file "#{@osiris_conf}" \; display "tmux.fold.conf reloaded"
